# rtst_rover 플래닝 preset — default_preset.yaml 복사본(Autoware 0.53.0). default 는 건드리지 않고 여기서만 바꾼다.
#
# 쓰는 법
#   새 파일이므로 최초 1회:  rover build autoware_planning_config      (심링크 등록, 이후 수정은 restart 만)
#   기동:                    rover psim restart planning_module_preset:=rover
#   확인:                    rover psim check  → 노드 수(바꾸기 전 값을 적어 두고 비교), 죽은 프로세스 0, 같은 route 로 AUTO 거동 비교
#   되돌리기:                planning_module_preset 인자를 빼면 default 로 기동
#
# 지금 테스트 지도(sample-map-planning)에 있는 요소 — 아래 모듈을 끄면 거동 변화가 "보인다"
#   crosswalk 4 · walkway 2 · traffic_light 10 · virtual_traffic_light 3 · 교차로(turn_direction 114, right_of_way 18)
#   detection_area 2 · no_stopping_area 2 · stop_line 다수 · parking_lot 1(parking_space 5) · direction_change 0
#
# 실험 목록 — 한 번에 한 줄씩 바꾸고 restart → 관찰 → 메모. 끝나면 로버용 최종값을 정하고 각 줄에 이유를 주석으로 남긴다.
#
# [A] 지도 요소 기반 모듈 끄기 (실내 로버 지도엔 없을 것들. 지금 지도엔 있어서 "횡단보도·교차로·신호등 앞에서 멈추던 것이 사라지는지" 관찰)
#     launch_crosswalk_module          "true" → "false"
#     launch_walkway_module            "true" → "false"
#     launch_traffic_light_module      "true" → "false"
#     launch_virtual_traffic_light_module "true" → "false"
#     launch_intersection_module       "true" → "false"
#     launch_blind_spot_module         "true" → "false"
#     유지(실내 지도 설계 때 쓸 것): launch_detection_area_module · launch_no_stopping_area_module · launch_stop_line_module
#
# [B] 차선 변경 끄기 (로버 실내 = 단일 차로. 회피가 차선변경 대신 같은 차로 안 회피만 남는지 관찰)
#     launch_lane_change_right_module  "true" → "false"
#     launch_lane_change_left_module   "true" → "false"
#     launch_avoidance_by_lane_change_module "true" → "false"
#
# [C] 장애물 (RViz 툴바 2D Dummy Pedestrian/Car 로 장애물을 놓고 관찰. 입력 = dummy_perception_publisher 의 objects/pointcloud)
#     launch_obstacle_cruise_module    "true" → "false"   (앞차 속도 맞춰 따라가기 — 실내 의미 적음. 끄고도 정지·감속은 stop/slow_down 이 하는지 확인)
#     launch_surround_obstacle_checker "false" → "true"   (출발 전 주변 반경에 장애물 있으면 출발 금지 — 로버엔 켠다. 차 바로 옆에 Dummy 놓고 AUTO 시 출발 막히는지)
#     launch_out_of_lane_module        "true" → "false"   ┐ 둘 다 끄고 차로 밖 장애물 회피 때 경계를 정말 무시하는지 관찰. 관찰 후 "true" 복구
#     launch_boundary_departure_prevention_module "true" → "false" ┘
#     켜 둘 것: launch_obstacle_stop_module · launch_obstacle_slow_down_module · launch_dynamic_obstacle_stop_module · launch_run_out_module · launch_road_user_stop_module
#       (끄면 그 장애물을 플래너가 무시해 경로가 장애물을 통과. 수치 조정은 scenario_planning/**/*.param.yaml 에서 OVERRIDE 표기로)
#
# [D] 속도 프로파일 — velocity_smoother_type  JerkFiltered → L2 → Analytical 순으로 바꿔 출발·정지의 부드러움 비교 (Linf 는 파일 주석대로 Unstable, 건너뜀)
#     각 타입의 수치 파일: scenario_planning/common/autoware_velocity_smoother/<타입>.param.yaml
#
# [E] 경로 모양 — RViz 궤적선으로 비교
#     motion_path_smoother_type  elastic_band → none
#     motion_path_planner_type   path_optimizer → path_sampler → none
#
# [F] 기타
#     launch_parking_module  "true" → "false"   (주차장 진입 시 자유공간 플래너 전환. 실내 로버엔 불필요 — 지금 지도의 주차장 goal 로 켜고/끄고 비교 가능)
#     launch_direction_change_module  지도에 direction_change 태그가 없어 켜도 무동작 → 그대로 "false"
#
launch:
  - arg:
      name: behavior_path_planner_type
      default: behavior_path_planner
    # option: behavior_path_planner
    #         path_generator

  # behavior path modules
  - arg:
      name: launch_static_obstacle_avoidance
      default: "true"
  - arg:
      name: launch_avoidance_by_lane_change_module
      default: "true"
  - arg:
      name: launch_dynamic_obstacle_avoidance
      default: "false"
  - arg:
      name: launch_sampling_planner_module
      default: "false" # Warning, experimental module, use only in simulations
  - arg:
      name: launch_lane_change_right_module
      default: "true"
  - arg:
      name: launch_lane_change_left_module
      default: "true"
  - arg:
      name: launch_external_request_lane_change_right_module
      default: "false"
  - arg:
      name: launch_external_request_lane_change_left_module
      default: "false"
  - arg:
      name: launch_goal_planner_module
      default: "true"
  - arg:
      name: launch_start_planner_module
      default: "true"
  - arg:
      name: launch_side_shift_module
      default: "true"
  - arg:
      name: launch_bidirectional_traffic_module
      default: "true"
  - arg:
      name: launch_direction_change_module
      default: "false"

  # behavior velocity modules
  - arg:
      name: launch_crosswalk_module
      default: "true" # Edited
  - arg:
      name: launch_walkway_module
      default: "true"
  - arg:
      name: launch_traffic_light_module
      default: "true" # Edited
  - arg:
      name: launch_intersection_module
      default: "true"
  - arg:
      name: launch_roundabout_module
      default: "false"
  - arg:
      name: launch_merge_from_private_module
      default: "false"
  - arg:
      name: launch_blind_spot_module
      default: "true"
  - arg:
      name: launch_detection_area_module
      default: "true"
  - arg:
      name: launch_virtual_traffic_light_module
      default: "true"
  - arg:
      name: launch_no_stopping_area_module
      default: "true"
  - arg:
      name: launch_stop_line_module
      default: "true"
  - arg:
      name: launch_occlusion_spot_module
      default: "false"
  - arg:
      name: launch_speed_bump_module
      default: "false"
  - arg:
      name: launch_no_drivable_lane_module
      default: "false"

  # motion planning modules
  - arg:
      name: motion_path_smoother_type
      default: elastic_band
      # option: elastic_band
      #         none

  - arg:
      name: motion_path_planner_type
      default: path_optimizer
      # option: path_optimizer
      #         path_sampler
      #         none

  # motion velocity planner modules
  - arg:
      name: launch_obstacle_stop_module
      default: "true"
  - arg:
      name: launch_obstacle_slow_down_module
      default: "true"
  - arg:
      name: launch_obstacle_cruise_module
      default: "true"
  - arg:
      name: launch_dynamic_obstacle_stop_module
      default: "true"
  - arg:
      name: launch_out_of_lane_module
      default: "true"
  - arg:
      name: launch_obstacle_velocity_limiter_module
      default: "true"
  - arg:
      name: launch_run_out_module
      default: "true"
  - arg:
      name: launch_boundary_departure_prevention_module
      default: "true"
  - arg:
      name: launch_road_user_stop_module
      default: "true"

  - arg:
      name: velocity_smoother_type
      default: JerkFiltered
      # option: JerkFiltered
      #         L2
      #         Linf(Unstable)
      #         Analytical

  - arg:
      name: launch_surround_obstacle_checker
      default: "false"

  # parking modules
  - arg:
      name: launch_parking_module
      default: "true"

  # validator modules
  - arg:
      name: launch_latency_checker
      default: "true"
  - arg:
      name: launch_trajectory_checker
      default: "true"
  - arg:
      name: launch_intersection_collision_checker
      default: "true"
  - arg:
      name: launch_rear_collision_checker
      default: "true"

  # other modules
  - arg:
      name: launch_remaining_distance_time_calculator
      default: "true"
