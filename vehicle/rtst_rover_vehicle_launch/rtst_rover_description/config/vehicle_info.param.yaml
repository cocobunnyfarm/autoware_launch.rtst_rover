    front_overhang: 0.048 # between front wheel center and vehicle front (0.142 - 0.094)
    rear_overhang: 0.059 # between rear wheel center and vehicle rear (0.143 - 0.084)
    left_overhang: 0.019 # between left wheel center and vehicle left (0.106 - 0.086)
    right_overhang: 0.019 # between right wheel center and vehicle right
    vehicle_height: 0.231 # 팔 접음·라이다 제외 (미정: 라이다·팔 포함 시 상향)
